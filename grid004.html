<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网格布局grid</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .photo_box{
            display: grid;
            /*网格分成3列，1fr表示每列的宽度为剩余宽度的一份*/
            grid-template-columns: 1fr 1fr 1fr;
            /*grid-template-columns: repeat(3,1fr);与上面效果相同*/
            gap: 10px 15px;
           
        }
        .photo{
            min-height: 100px;
            background-color: pink;
            border: 5px;
            border-radius: 5px;
            color: skyblue;
            text-align: center;
            line-height: 100px;
           
        }
        .photo:nth-child(1){
            grid-column: span 2;
        }
        .photo:nth-child(2){
            grid-row: span 2;
        }
    </style>
</head>
<body>
    <div class="photo_box">
        <div class="photo">1</div>
        <div class="photo">2</div>
        <div class="photo">3</div>
        <div class="photo">4</div>
        <div class="photo">5</div>
        <div class="photo">6</div>
    </div>
</body>
</html>
