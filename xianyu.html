<!DOCTYPE html>
<!--
  项目：闲鱼APP 网页元素设计 - 卖闲置发布页
  学号：24001010530  姓名：金鑫  班级：计算机24005

<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>闲鱼 - 来闲鱼搞点钱</title>
  <link rel="stylesheet" href="xianyu.css">
</head>
<body>

  <!-- 整个手机页面容器 -->
  <div class="jx-page">

    <!-- ============ 顶部标题区 ============ -->
    <header class="top-area">
      <h1 class="main-title">来闲鱼 搞点钱</h1>
      <p class="sub-title">3亿人在闲鱼赚钱</p>
    </header>

    <!-- ============ 自己卖 区域 ============ -->
    <section class="sell-section">
      <h2 class="section-title">自己卖</h2>

      <!-- 发闲置：整行黄色卡片 -->
       
      <div class="card jx-card-yellow">
        <img class="card-icon" src="img/faxianzhi.jpg" alt="发闲置">
        <div class="card-text">
          <p class="card-name">发闲置</p>
          <p class="card-desc">自己拍图卖啥都能换钱</p>
        </div>
      </div>

      <!-- 一键转卖 + 发服务：左右两个半宽卡片 -->
      <div class="card-row">
        <div class="card card-gray card-half">
          <img class="card-icon" src="img/yijianzhuanmai.jpg" alt="一键转卖">
          <div class="card-text">
            <p class="card-name">一键转卖</p>
            <p class="card-desc">还能卖100元</p>
          </div>
        </div>

        <div class="card card-gray card-half">
          <img class="card-icon" src="img/fafuwu.jpg" alt="发服务">
          <div class="card-text">
            <p class="card-name">发服务</p>
            <p class="card-desc">搞副业能赚钱</p>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ 平台卖 区域 ============ -->
    <section class="sell-section">
      <h2 class="section-title">平台卖</h2>

      <!-- 闲鱼回收：整行灰色卡片 -->
      <div class="card card-gray">
        <img class="card-icon" src="img/xianyuhuishou.jpg" alt="闲鱼回收">
        <div class="card-text">
          <p class="card-name">闲鱼回收</p>
          <p class="card-desc">省心极速卖得高</p>
        </div>
      </div>
    </section>

    <!-- ============ 底部关闭按钮 ============ -->
    <div class="jx-close-btn">
      <img src="img/guanbianniu.jpg" alt="关闭">
    </div>

  </div>

</body>
</html>
