<!DOCTYPE html>
<!--
  项目：闲鱼APP 网页元素设计 - 首页
  学号：24001010530  姓名：金鑫  班级：计算机24005
  导航说明：底部导航使用 iconfont 字体图标（font xianyu/ 目录），
    新增类名以 jx530- 前缀命名；五项页面互链，当前页"首页"高亮
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>闲鱼 - 首页</title>
  <link rel="stylesheet" href="xianyu3.css">
  <!-- 闲鱼专属字体图标样式（含 @font-face 字体文件） -->
  <link rel="stylesheet" href="font xianyu/iconfont.css">
</head>
<body>

  <!-- 整个手机页面容器 -->
  <div class="jx-page">

    <!-- ============ 顶部导航栏 ============ -->
    <header class="top-nav">
      <nav class="nav-menu">
        <a class="nav-item active">首页</a>
        <a class="nav-item">集市</a>
        <a class="nav-item">圈子</a>
        <a class="nav-item">
          <img class="jianlou-badge" src="img/laijianlou.jpg" alt="来捡漏">
        </a>
        <a class="nav-item">回收</a>
      </nav>
      <!-- 右上角签到入口 -->
      <div class="qiandao">
        <img src="img/qiandao.jpg" alt="签到">
      </div>
    </header>

    <!-- ============ 搜索栏 ============ -->
    <div class="search-bar">
      <img class="search-icon" src="img/sousuo.jpg" alt="搜索">
      <input class="search-input" type="text" placeholder="盗墓笔记全集">
      <img class="camera-icon" src="img/paizhao.jpg" alt="拍照">
      <button class="search-btn">
        <img src="img/sousuo.jpg" alt="搜索">
      </button>
    </div>

    <!-- ============ 分类筛选标签 ============ -->
    <div class="filter-tabs">
      <a>找服务</a>
      <a>价格指数</a>
      <a class="filter-active">数码</a>
      <a>玩车</a>
      <a>手机</a>
      <a>户外</a>
      <span class="filter-more">▼</span>
    </div>

    <!-- ============ 分类图标网格 ============ -->
    <div class="jx-category-grid">
      <!-- 第一行 -->
      <div class="cat-item">
        <img src="img/shubiaodian.jpg" alt="鼠标垫">
        <p>鼠标垫</p>
      </div>
      <div class="cat-item">
        <img src="img/zuzhuangtaiji.jpg" alt="组装台机">
        <p>组装台机</p>
      </div>
      <div class="cat-item">
        <img src="img/bijibendiannao.jpg" alt="笔记本电脑">
        <p>笔记本电脑</p>
      </div>
      <div class="cat-item">
        <img src="img/pingbandiannao.jpg" alt="平板电脑">
        <p>平板电脑</p>
      </div>
      <div class="cat-item">
        <img src="img/lanyaerji.jpg" alt="蓝牙耳机">
        <p>蓝牙耳机</p>
      </div>
      <!-- 第二行 -->
      <div class="cat-item">
        <img src="img/diannaoxianka.jpg" alt="电脑显卡">
        <p>电脑显卡</p>
      </div>
      <div class="cat-item">
        <img src="img/shoujike,jpg.jpg" alt="手机壳">
        <p>手机壳</p>
      </div>
      <div class="cat-item">
        <img src="img/zhinengshoubiao.jpg" alt="智能手表">
        <p>智能手表</p>
      </div>
      <div class="cat-item">
        <img src="img/jianpan.jpg" alt="键盘">
        <p>键盘</p>
      </div>
      <div class="cat-item">
        <img src="img/youxiguangpan.jpg" alt="PS游戏光盘">
        <p>PS游戏光盘</p>
      </div>
      <!-- 第三行 -->
      <div class="cat-item">
        <img src="img/pinpaidiannao.jpg" alt="品牌台机">
        <p>品牌台机</p>
      </div>
      <div class="cat-item">
        <img src="img/diannaoneicun.jpg" alt="电脑内存">
        <p>电脑内存</p>
      </div>
      <div class="cat-item">
        <img src="img/youxiji.jpg" alt="游戏机">
        <p>游戏机</p>
      </div>
      <div class="cat-item">
        <img src="img/xiangji.jpg" alt="微单相机">
        <p>微单相机</p>
      </div>
      <div class="cat-item">
        <img src="img/gengduofenlei.jpg" alt="更多分类">
        <p>更多分类</p>
      </div>
    </div>

    <!-- ============ 商品卡片列表 ============ -->
    <div class="product-list">

      <!-- 左列商品 -->
      <div class="jx-product-card">
        <div class="product-img-wrap">
          <img src="img/shoumaishangpin1.jpg" alt="松下相机">
          <span class="tag-baoyou">包邮</span>
        </div>
        <div class="product-info">
          <p class="product-title">松下fx33 藕粉色 功</p>
          <p class="product-desc">Panasonic/松下</p>
          <p class="product-price">¥389 <span class="want-count">90人想要</span></p>
          <div class="product-seller">
            <span class="seller-name">小白的果冻</span>
            <span class="star">★★★★★</span>
          </div>
          <div class="product-tags">
            <span class="tag-zan">赞</span>
            <span class="tag-shop">星小铺 L5</span>
          </div>
          <p class="original-price">¥962</p>
        </div>
      </div>

      <!-- 右列商品 -->
      <div class="jx-product-card">
        <div class="product-img-wrap">
          <img src="img/shoumaishangpin2.jpg" alt="手机壳">
          <div class="location-tag">
            <span>📍 7.3km 西岗区</span>
          </div>
        </div>
        <div class="product-info">
          <span class="tag-baoyou small">包邮</span>
          <p class="product-title">品牌手机壳 16pm</p>
          <p class="product-desc">Apple/苹果 | 轻微使用痕迹</p>
          <p class="product-price">¥158 <span class="want-count">3人想要</span></p>
          <div class="price-badge">¥30</div>
        </div>
      </div>

    </div>

    <!-- ============ 底部导航栏（iconfont 字体图标版，固定+自适应五等分） ============ -->
    <nav class="jx530-tabbar">
      <a class="jx530-tab jx530-tab-active" href="xianyu3.html">
        <span class="iconfont icon-xianyu-weixuanzhong"></span>
        <span class="jx530-tab-label">首页</span>
      </a>
      <a class="jx530-tab" href="tongcheng.html">
        <span class="iconfont icon-dingwei"></span>
        <span class="jx530-tab-label">同城</span>
      </a>
      <!-- 中间凸起的卖闲置按钮：黄色圆底 + 白色加号 -->
      <a class="jx530-tab" href="xianyu.html">
        <span class="jx530-tab-center"><span class="iconfont icon-xianyu-xiangqingguanzhu"></span></span>
        <span class="jx530-tab-label">卖闲置</span>
      </a>
      <a class="jx530-tab" href="xiaoxi.html">
        <span class="iconfont icon-xiaoxi"></span>
        <span class="jx530-tab-label">消息</span>
      </a>
      <a class="jx530-tab" href="xianyu2.html">
        <span class="iconfont icon-wode"></span>
        <span class="jx530-tab-label">我的</span>
      </a>
    </nav>

  </div>

</body>
</html>
